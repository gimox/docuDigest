name: docudiget
version: 1.0.0
summary: Generated by Icons Launcher
description: Generated by Icons Launcher package for Linux.

confinement: strict
base: core22
grade: stable

slots:
  dbus-docudiget: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.bar.docudiget # adjust accordingly to your app name

apps:
  docudiget:
    command: docudiget
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-docudiget
parts:
  docudiget:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart # The main entry-point file of the application
